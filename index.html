<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoteTaking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ SIGN IN ============ -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="brand-mark" style="margin-bottom:6px;">NoteTaking</div>
    <p class="auth-sub" id="authSub">Sign in to sync your notes across every device.</p>
    <div id="authError" class="auth-error hidden"></div>
    <button type="button" id="googleSignInBtn" class="btn gold google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>
  </div>
</div>

<div id="app" class="hidden">

  <!-- ============ SIDEBAR ============ -->
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-mark">NoteTaking</span>
    </div>

    <nav class="nav-list">
      <button class="nav-item" id="homeNavBtn" data-view="home">
        <span class="nav-dot home-dot"></span> Home
      </button>
      <div id="classNavList"></div>
    </nav>

    <button id="addClassBtn" class="add-class-btn">+ Add a class</button>

    <div class="sidebar-footer">
      <div id="userEmailLabel"></div>
      <button id="signOutBtn" class="auth-toggle" style="padding:0;">Sign out</button>
    </div>
  </aside>

  <!-- ============ MAIN CONTENT ============ -->
  <main id="content">
    <!-- rendered dynamically by script.js -->
  </main>

</div>

<!-- ============ MODAL OVERLAY (Add Class / Day popup / Add Event / Add Todo) ============ -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div id="modalBody" class="modal-body"></div>
</div>

<!-- ============ RIGHT-CLICK / LONG-PRESS CONTEXT MENU (todo / quiz items) ============ -->
<div id="contextMenu" class="context-menu hidden">
  <button id="ctxEdit">✏️ Edit task</button>
  <button id="ctxDelete">🗑 Delete task</button>
</div>

<!-- ============ RIGHT-CLICK CONTEXT MENU (calendar day: add/delete event) ============ -->
<div id="dayContextMenu" class="context-menu hidden"></div>

<!-- ============ FIREBASE (fill in firebase-config.js with your project's keys) ============ -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
